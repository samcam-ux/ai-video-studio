<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #0f0f14; color: #eee; min-height: 100vh; }
  header { padding: 16px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 20px; } h1 span { color: #a78bfa; }
  .credits { background: #1e1e28; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  .card { background: #17171f; border: 1px solid #26263a; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 90px; background: #0f0f14; border: 1px solid #333; border-radius: 8px; color: #eee; padding: 12px; font-size: 15px; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  select { background: #0f0f14; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 10px; }
  button { background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #26263a; }
  .video-grid { display: grid; gap: 16px; }
  .video-item video { width: 100%; border-radius: 8px; background: #000; }
  .video-item p { font-size: 13px; color: #aaa; margin-top: 6px; }
  .status { font-size: 13px; color: #a78bfa; }
  #auth { text-align: center; padding: 60px 20px; }
  #auth input { display: block; width: 100%; max-width: 320px; margin: 8px auto; padding: 12px; background: #17171f; border: 1px solid #333; border-radius: 8px; color: #eee; }
  .hidden { display: none; }
  .note { font-size: 12px; color: #777; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>🎬 <span>AI Video</span> Studio</h1>
  <div id="userbar" class="hidden">
    <span class="credits">🎟️ <b id="credCount">0</b> credits</span>
    <button class="secondary" onclick="buyCredits()" style="padding:8px 14px;font-size:13px;margin-left:8px">Buy 20 — $9</button>
    <button class="secondary" onclick="logout()" style="padding:8px 14px;font-size:13px;margin-left:4px">Logout</button>
  </div>
</header>

<div id="auth">
  <h2 style="margin-bottom:16px">Create videos from text</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <div class="row" style="justify-content:center">
    <button onclick="doLogin()">Log in</button>
    <button class="secondary" onclick="doRegister()">Sign up (3 free)</button>
  </div>
  <p id="authErr" style="color:#f66;margin-top:12px"></p>
</div>

<main id="app" class="hidden">
  <div class="card">
    <textarea id="prompt" placeholder="Describe your video… e.g. A drone shot flying over a neon city at night in the rain"></textarea>
    <div class="row">
      <select id="duration">
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
      <label style="font-size:14px;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="enhance" checked> ✨ Enhance prompt
      </label>
      <button id="genBtn" onclick="generate()">Generate video</button>
    </div>
    <p class="note">1 credit per video. Videos typically take 1–3 minutes to render.</p>
    <p id="genErr" style="color:#f66;margin-top:8px"></p>
  </div>
  <h3 style="margin: 8px 0 12px">Your videos</h3>
  <div id="videos" class="video-grid"></div>
</main>

<script>
let token = localStorage.getItem('vstoken');
const api = (p, o={}) => fetch(p, { ...o,
  headers: { 'Content-Type': 'application/json', ...(token ? {Authorization: 'Bearer '+token} : {}), ...(o.headers||{}) }
}).then(r => r.json().then(j => ({ok: r.ok, j})));

async function refresh() {
  const {ok, j} = await api('/api/me');
  if (!ok) { showAuth(); return; }
  document.getElementById('credCount').textContent = j.credits;
  showApp();
  const wrap = document.getElementById('videos');
  wrap.innerHTML = '';
  [...j.videos].reverse().forEach(v => {
    const d = document.createElement('div');
    d.className = 'video-item card';
    if (v.url) d.innerHTML = `<video src="${v.url}" controls playsinline></video><p>${esc(v.prompt)}</p>` + (v.overlay_text ? `<p style="font-size:12px;color:#777">📝 "${esc(v.overlay_text)}"</p>` : '') + (v.edit_from ? `<p style="font-size:12px;color:#777">✏️ Edit: ${esc(v.prompt)}</p>` : '') + `` + (v.enhanced_prompt && v.enhanced_prompt !== v.prompt ? `<p style="font-size:12px;color:#777">✨ ${esc(v.enhanced_prompt)}</p>` : '') + (v.dialogue ? `<p style="font-size:12px;color:#777">🗣️ "${esc(v.dialogue)}"</p>` : '') + (v.enhanced_from || v.dialogue_from || v.combined_from || v.text_from || v.edit_from ? '' : `<label style="font-size:13px;display:flex;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" class="combine-check" value="${v.prediction_id}"> Select for combine</label><button class="secondary" style="margin-top:8px;font-size:13px;padding:8px 14px" onclick="upscale('${v.prediction_id}')">⬆️ Enhance to 4K (2 credits)</button><p id="up-${v.prediction_id}" style="font-size:12px;color:#f66"></p><div style="margin-top:8px"><input id="dg-${v.prediction_id}" placeholder="Dialogue for character to speak…" style="font-size:13px;padding:8px"><button class="secondary" style="font-size:13px;padding:8px 14px" onclick="addDialogue('${v.prediction_id}')">🗣️ Add dialogue (2 credits)</button><p id="dgerr-${v.prediction_id}" style="font-size:12px;color:#f66"></p></div><div style="margin-top:8px"><input id="tx-${v.prediction_id}" placeholder="Text to burn onto video…" maxlength="120" style="font-size:13px;padding:8px"><select id="txpos-${v.prediction_id}" style="font-size:13px;padding:8px;margin-left:4px"><option value="top">Top</option><option value="bottom" selected>Bottom</option><option value="center">Center</option></select> <button class="secondary" style="font-size:13px;padding:8px 14px" onclick="addText('${v.prediction_id}')">📝 Add text (1 credit)</button><p id="txerr-${v.prediction_id}" style="font-size:12px;color:#f66"></p></div><div style="margin-top:8px"><input id="ed-${v.prediction_id}" placeholder="Describe the change… e.g. make it sunset" style="font-size:13px;padding:8px"><button class="secondary" style="font-size:13px;padding:8px 14px" onclick="editVideo('${v.prediction_id}')">✏️ Edit video (1 credit)</button><p id="ederr-${v.prediction_id}" style="font-size:12px;color:#f66"></p></div>`);
    else d.innerHTML = `<p>${esc(v.prompt)}</p>` + (v.overlay_text ? `<p style="font-size:12px;color:#777">📝 "${esc(v.overlay_text)}"</p>` : '') + (v.edit_from ? `<p style="font-size:12px;color:#777">✏️ Edit: ${esc(v.prompt)}</p>` : '') + `<p class="status" data-pid="${v.prediction_id}">⏳ ${esc(v.status||'rendering')}…</p>`;
    wrap.appendChild(d);
  });
  // combine bar
  let cbar = document.getElementById('combineBar');
  if (!cbar) {
    cbar = document.createElement('div');
    cbar.id = 'combineBar';
    cbar.className = 'card';
    cbar.style.cssText = 'margin-top:16px;text-align:center';
    wrap.after(cbar);
  }
  cbar.innerHTML = `<button onclick="combineSelected()">🎬 Combine selected into one video (1 credit)</button><p id="combineErr" style="font-size:12px;color:#f66"></p><p style="font-size:12px;color:#777">Pick 2–4 clips above, in order. They'll be stitched end-to-end.</p>`;
  document.querySelectorAll('[data-pid]').forEach(el => poll(el.dataset.pid, el));
}
async function poll(pid, el) {
  const {ok, j} = await api('/api/status/'+pid);
  if (!ok) return;
  const out = Array.isArray(j.output) ? j.output[0] : j.output;
  if (j.status === 'succeeded' && out) { refresh(); }
  else if (j.status === 'failed') { el.textContent = '❌ failed'; }
  else setTimeout(() => poll(pid, el), 5000);
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showAuth(){ document.getElementById('auth').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); document.getElementById('userbar').classList.add('hidden'); }
function showApp(){ document.getElementById('auth').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('userbar').classList.remove('hidden'); }
async function doRegister(){ await doAuth('/api/register'); }
async function doLogin(){ await doAuth('/api/login'); }
async function doAuth(path){
  const email = document.getElementById('email').value, password = document.getElementById('password').value;
  const {ok, j} = await api(path, {method:'POST', body: JSON.stringify({email, password})});
  if (!ok) { document.getElementById('authErr').textContent = j.detail || 'Error'; return; }
  token = j.token; localStorage.setItem('vstoken', token); refresh();
}
function logout(){ localStorage.removeItem('vstoken'); token = null; showAuth(); }
async function generate(){
  const prompt = document.getElementById('prompt').value;
  const duration = parseInt(document.getElementById('duration').value);
  const enhance = document.getElementById('enhance').checked;
  const btn = document.getElementById('genBtn'); btn.disabled = true;
  document.getElementById('genErr').textContent = '';
  const {ok, j} = await api('/api/generate', {method:'POST', body: JSON.stringify({prompt, duration, enhance})});
  btn.disabled = false;
  if (!ok) { document.getElementById('genErr').textContent = j.detail || 'Error'; return; }
  document.getElementById('prompt').value = '';
  refresh();
}
async function buyCredits(){
  const {ok, j} = await api('/api/checkout', {method:'POST'});
  if (ok && j.url) location.href = j.url;
}
async function upscale(pid){
  const err = document.getElementById('up-'+pid);
  err.textContent = 'Enhancing… (takes a few minutes)';
  const {ok, j} = await api('/api/upscale', {method:'POST', body: JSON.stringify({prediction_id: pid, target: '4K'})});
  if (!ok) { err.textContent = j.detail || 'Error'; return; }
  refresh();
}
async function addDialogue(pid){
  const text = document.getElementById('dg-'+pid).value;
  const err = document.getElementById('dgerr-'+pid);
  if (!text.trim()) { err.textContent = 'Type something for them to say.'; return; }
  err.textContent = 'Generating speech + lip-sync… (takes a few minutes)';
  const {ok, j} = await api('/api/dialogue', {method:'POST', body: JSON.stringify({prediction_id: pid, text})});
  if (!ok) { err.textContent = j.detail || 'Error'; return; }
  refresh();
}
async function editVideo(pid){
  const edit_prompt = document.getElementById('ed-'+pid).value.trim();
  const err = document.getElementById('ederr-'+pid);
  err.textContent = '';
  if(!edit_prompt){ err.textContent = 'Describe the change first.'; return; }
  err.textContent = 'Editing video… (1–3 min)';
  const {ok, j} = await api('/api/edit-video', {method:'POST', body: JSON.stringify({prediction_id: pid, edit_prompt})});
  if(!ok){ err.textContent = j.detail || 'Failed'; return; }
  refresh();
}
async function addText(pid){
  const text = document.getElementById('tx-'+pid).value.trim();
  const position = document.getElementById('txpos-'+pid).value;
  const err = document.getElementById('txerr-'+pid);
  err.textContent = '';
  if(!text){ err.textContent = 'Type some text first.'; return; }
  err.textContent = 'Adding text…';
  const {ok, j} = await api('/api/text-overlay', {method:'POST', body: JSON.stringify({prediction_id: pid, text, position})});
  if(!ok){ err.textContent = j.detail || 'Failed'; return; }
  refresh();
}
async function combineSelected(){
  const ids = [...document.querySelectorAll('.combine-check:checked')].map(c => c.value);
  const err = document.getElementById('combineErr');
  if (ids.length < 2 || ids.length > 4) { err.textContent = 'Select 2 to 4 clips.'; return; }
  err.textContent = 'Stitching clips together…';
  const {ok, j} = await api('/api/combine', {method:'POST', body: JSON.stringify({prediction_ids: ids})});
  if (!ok) { err.textContent = j.detail || 'Error'; return; }
  refresh();
}
if (token) refresh(); else showAuth();
</script>
</body>
</html>
